<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AT Digital Onboarding Passport</title>
<meta name="description" content="ระบบบริหารจัดการพนักงานใหม่ตั้งแต่ก่อนเริ่มงานจนสิ้นสุด Onboarding และติดตามผลทดลองงาน · Allied-Tek">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c0272d">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AT Passport">
<style>
:root{
  --red:#c0272d; --red-dark:#8f1e23; --ink:#1f2328; --sub:#5b6168;
  --bg:#f5f6f8; --card:#ffffff; --line:#e5e7eb; --green:#1a7f45; --amber:#b8860b;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.06);
  --navy-dark:#0a1e3d; --navy:#122a52; --blue:#2f6fed; --blue-soft:#eaf1ff;
  --purple:#7c5cf0; --purple-soft:#f1ecfe; --green-soft:#e7f6ef; --amber-soft:#fbf0dc;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in-out:cubic-bezier(.4,0,.2,1);
  --dur-fast:.16s; --dur-base:.28s; --dur-slow:.5s;
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans Thai",sans-serif;
  -webkit-font-smoothing:antialiased;}
button{font-family:inherit;}
a{color:inherit;}
#app{min-height:100vh;display:flex;flex-direction:column;}
.hidden{display:none !important;}
.btn{border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;position:relative;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;overflow:hidden;
  transition:background var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out),
  box-shadow var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out);}
.btn::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.35);border-radius:inherit;
  transform:scale(0);opacity:0;transition:transform .35s var(--ease-out),opacity .5s;pointer-events:none;}
.btn:active::after{transform:scale(1);opacity:1;transition:none;}
.btn:not(:disabled):hover{transform:translateY(-1px);}
.btn:not(:disabled):active{transform:translateY(0) scale(.97);}
.btn-primary{background:var(--red);color:#fff;}
.btn-primary:hover{background:var(--red-dark);box-shadow:0 6px 16px rgba(192,39,45,.3);}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
.btn-ghost:hover{background:#f0f1f3;}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px;}
.btn-danger{background:#fff;color:#b3261e;border:1px solid #f3c7c4;}
.btn-danger:hover{background:#fdf2f1;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn:disabled:hover{transform:none;}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);
  border-radius:9px;background:#fff;color:var(--ink);width:100%;}
input:focus,select:focus,textarea:focus{outline:2px solid #e3b3b3;border-color:var(--red);}
label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:10px;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;
  transition:transform var(--dur-base) var(--ease-out),box-shadow var(--dur-base) var(--ease-out);}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.09);}
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
th{color:var(--sub);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;}
tr:last-child td{border-bottom:none;}
tbody tr{transition:background var(--dur-fast) var(--ease-out);}
tbody tr:hover{background:#fafbfc;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;
  transition:transform var(--dur-fast) var(--ease-out);}
.pill-green{background:#e6f4ea;color:var(--green);}
.pill-amber{background:#fdf1dc;color:var(--amber);}
.pill-gray{background:#eef0f2;color:var(--sub);}
.pill-red{background:#fbe9e8;color:var(--red-dark);}
.badge{font-size:11px;font-weight:700;background:#eef0f2;color:var(--sub);padding:2px 8px;border-radius:6px;}
h1,h2,h3,h4{margin:0 0 4px;}
.muted{color:var(--sub);}
.small{font-size:12.5px;}
.section-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);
  margin:22px 0 10px;}
.section-title:first-child{margin-top:0;}
.flex{display:flex;align-items:center;}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.flex-wrap{flex-wrap:wrap;}
.gap-8{gap:8px;} .gap-10{gap:10px;} .gap-16{gap:16px;}
.mt-8{margin-top:8px;} .mt-16{margin-top:16px;} .mt-24{margin-top:24px;}
.progress-track{height:8px;border-radius:999px;background:#eef0f2;overflow:hidden;}
.progress-fill{height:100%;background:var(--red);border-radius:999px;transition:width .8s var(--ease-out);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2328;color:#fff;
  padding:11px 20px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);z-index:999;opacity:0;
  pointer-events:none;transition:opacity .25s, transform .25s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,24,.5);display:flex;align-items:flex-start;
  justify-content:center;padding:4vh 16px;overflow-y:auto;z-index:500;animation:overlayIn var(--dur-base) var(--ease-out) both;}
.modal-overlay.closing{animation:overlayOut var(--dur-fast) ease both;}
.modal{background:#fff;border-radius:16px;max-width:680px;width:100%;padding:22px;box-shadow:var(--shadow);
  margin-bottom:4vh;animation:modalIn var(--dur-base) var(--ease-out) both;}
.modal-overlay.closing .modal{animation:modalOut var(--dur-fast) ease both;}
.modal-wide{max-width:920px;}
@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
@keyframes overlayOut{from{opacity:1;}to{opacity:0;}}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.98);}to{opacity:1;transform:none;}}
@keyframes modalOut{from{opacity:1;transform:none;}to{opacity:0;transform:translateY(10px) scale(.98);}}
.checklist-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:flex-start;
  padding:10px 0;border-bottom:1px solid var(--line);}
.checklist-row:last-child{border-bottom:none;}
.chk-box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex:none;margin-top:2px;
  transition:background var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out);}
.chk-box:hover{transform:scale(1.08);}
.chk-box.done{background:var(--green);border-color:var(--green);animation:checkPop .35s var(--ease-out);}
@keyframes checkPop{0%{transform:scale(.6);}60%{transform:scale(1.18);}100%{transform:scale(1);}}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0;}
.tab{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;
  cursor:pointer;white-space:nowrap;transition:color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out);}
.tab.active{color:var(--red);border-color:var(--red);}
.radio-row{display:flex;gap:16px;flex-wrap:wrap;}
.radio-opt{display:flex;align-items:center;gap:5px;font-size:13.5px;cursor:pointer;}
.radio-opt input{width:auto;}
textarea{min-height:60px;resize:vertical;}

/* ---------- Global animation system (design tokens above) ---------- */
.count-num{font-variant-numeric:tabular-nums;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.content-enter{animation:contentFadeIn var(--dur-slow) var(--ease-out) both;}
@keyframes contentFadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.anim-fade-up{animation:fadeUp var(--dur-base) var(--ease-out) both;
  animation-delay:calc(var(--i, 0) * 55ms);}
/* confetti burst (checklist / milestone celebration) */
.confetti-piece{position:absolute;top:40%;left:50%;width:8px;height:8px;border-radius:2px;pointer-events:none;
  animation:confettiBurst .9s ease-out forwards;z-index:5;}
@keyframes confettiBurst{
  0%{transform:translate(0,0) rotate(0deg);opacity:1;}
  100%{transform:var(--confetti-end, translate(0,0)) rotate(540deg);opacity:0;}
}
/* branded boot loader */
.boot-loader{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;background:linear-gradient(170deg,#eef5fb 0%,#f8f5f3 55%,#ffffff 100%);}
.boot-logo{width:96px;height:96px;border-radius:50%;object-fit:contain;background:#fff;
  border:3px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:bootPulse 1.7s ease-in-out infinite;}
@keyframes bootPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
.boot-title{font-size:16px;font-weight:800;color:#33373d;}
.boot-skel{display:flex;flex-direction:column;gap:8px;width:220px;}
.boot-skel-bar{height:10px;border-radius:6px;background:linear-gradient(90deg,#e9edf1 25%,#f6f8fa 37%,#e9edf1 63%);
  background-size:400% 100%;animation:skelShimmer 1.4s ease-in-out infinite;}
.boot-skel-bar:nth-child(2){width:75%;}
.boot-skel-bar:nth-child(3){width:55%;}
@keyframes skelShimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important;
  }
}

/* ---------- Login screen ---------- */
#login-screen{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:24px;
  overflow:hidden;isolation:isolate;background:linear-gradient(170deg,#eef5fb 0%,#f8f5f3 55%,#ffffff 100%);}

.login-hero-bg{position:absolute;inset:0;z-index:0;
  background-image:linear-gradient(100deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,.35) 48%, rgba(255,255,255,.72) 100%),
    url('assets/hero/allied-tek-building.webp');
  background-size:cover;background-position:center 32%;}

.login-topwedge{position:absolute;top:0;right:0;z-index:1;width:48%;height:58%;pointer-events:none;
  background:linear-gradient(135deg,#e5091a 0%,#8f1e23 100%);clip-path:polygon(100% 0,100% 100%,22% 0);}
.login-topwedge::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,transparent 0 40px,rgba(255,255,255,.06) 40px 41px);
  animation:wedgeShimmer 9s linear infinite;}
@keyframes wedgeShimmer{from{transform:translateX(0);}to{transform:translateX(120px);}}

.login-caption{position:absolute;z-index:2;top:30px;right:40px;max-width:260px;text-align:right;
  font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:17px;line-height:1.3;color:#fff;
  text-shadow:0 2px 6px rgba(0,0,0,.25);animation:brandRise .8s ease .5s both;}

.login-wave{position:absolute;left:0;right:0;bottom:-2px;z-index:1;height:160px;pointer-events:none;}
.login-wave svg{position:absolute;bottom:0;width:100%;height:100%;}
.brand-pane-features{position:absolute;left:0;right:0;bottom:14px;z-index:2;display:flex;justify-content:center;
  gap:50px;flex-wrap:wrap;animation:brandRise .8s ease .6s both;}
.bpf-item{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:700;
  color:#fff;text-align:center;width:88px;line-height:1.25;text-shadow:0 1px 4px rgba(0,0,0,.3);}
.bpf-ic{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.8);
  display:flex;align-items:center;justify-content:center;font-size:19px;background:rgba(255,255,255,.16);}

.login-split{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;
  width:100%;max-width:1280px;padding:0 40px;gap:30px;}
.login-brand-pane{flex:1 1 56%;padding:30px 10px 200px;color:#33373d;}
.brand-pane-lockup{display:flex;align-items:center;gap:16px;margin-bottom:30px;animation:brandRise .8s ease .1s both;}
.brand-pane-logo{width:92px;height:92px;object-fit:contain;border-radius:50%;flex:none;
  border:3px solid #fff;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18);animation:logoFadeIn 1s ease both;}
.brand-pane-title-sm{font-size:26px;font-weight:800;line-height:1.25;color:#33373d;}
.brand-pane-title-sm b{color:var(--red);}
.brand-pane-tag-sm{font-size:16px;font-weight:600;color:#6b7078;margin-top:4px;}
.brand-pane-tag-sm i{color:var(--red);font-style:normal;margin:0 7px;}
.brand-pane-hero{animation:brandRise .8s ease .25s both;}
.grow-together{font-size:clamp(30px,4.2vw,48px);font-weight:800;line-height:1.1;margin-bottom:10px;color:#33373d;}
.grow-together b{color:var(--red);font-style:italic;font-weight:800;}
.grow-quote{font-size:17px;font-style:italic;color:#4d525a;}
@keyframes logoFadeIn{from{opacity:0;transform:translateY(-10px) scale(.92);}to{opacity:1;transform:none;}}
@keyframes brandRise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

.login-card{position:relative;z-index:3;background:rgba(255,255,255,.95);border-radius:22px;
  padding:30px 30px 24px;max-width:380px;width:100%;flex:none;box-shadow:0 25px 60px rgba(0,0,0,.25);
  animation:cardFloatIn .7s cubic-bezier(.2,.9,.3,1) both;}
@keyframes cardFloatIn{from{opacity:0;transform:translateY(26px) scale(.97);}to{opacity:1;transform:none;}}
.login-card-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
.login-logo{width:50px;height:50px;border-radius:14px;background:#fff;color:#fff;font-weight:800;
  font-size:20px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.18);animation:logoFadeIn .8s ease both;}
.login-logo img{width:100%;height:100%;object-fit:contain;}
.login-card h1{font-size:17.5px;line-height:1.25;}
.login-card p.sub{color:var(--sub);font-size:12.5px;margin:3px 0 0;}
.role-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:20px 0 16px;}
.role-opt{border:1.5px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;
  font-size:12px;font-weight:700;color:var(--sub);transition:all .15s ease;}
.role-opt:hover{border-color:#f3b9b9;background:#fff6f6;}
.role-opt.active{border-color:var(--red);color:var(--red);background:#fbe9e8;}
.login-card-divider{margin:18px 0 8px;border:none;border-top:1px solid var(--line);}
.login-card-tag{text-align:center;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:#c7a9aa;font-weight:700;}
.login-foot{margin-top:6px;text-align:center;font-size:11.5px;color:#9aa0a6;}

/* button hover / ripple sheen — scoped to the login screen only */
#login-screen .btn-primary{position:relative;overflow:hidden;transition:transform .15s ease,box-shadow .2s ease;}
#login-screen .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(192,39,45,.4);}
#login-screen .btn-primary:active{transform:translateY(0) scale(.98);}
#login-screen .btn-primary::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(115deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-20deg);transition:left .6s ease;}
#login-screen .btn-primary:hover::after{left:140%;}

@media(max-width:980px){
  .login-split{flex-direction:column;padding:0 20px;}
  .login-brand-pane,.login-topwedge,.login-caption,.login-wave,.brand-pane-features,.login-hero-bg{display:none;}
  #login-screen{background:linear-gradient(160deg,#c0272d 0%,#8f1e23 55%,#3a1012 100%);}
  .login-card{background:rgba(255,255,255,.96);}
}
@media(max-width:420px){
  .login-card{padding:26px 20px;border-radius:18px;}
  .login-card h1{font-size:16px;}
  .role-grid{gap:6px;}
}
@media(prefers-reduced-motion:reduce){
  .login-topwedge::after,.brand-pane-logo,.login-caption,.brand-pane-lockup,.brand-pane-hero,
  .brand-pane-features,.login-card,.login-logo,
  #login-screen .btn-primary::after{animation:none!important;transition:none!important;}
}

/* ---------- App shell ---------- */
#shell{flex:1;display:flex;min-height:100vh;}
.sidebar{width:230px;flex:none;background:var(--navy-dark);color:#fff;display:flex;flex-direction:column;padding:16px 10px;}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 18px;}
.brand .mark{width:34px;height:34px;border-radius:9px;background:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:14px;flex:none;overflow:hidden;}
.brand .mark img{width:100%;height:100%;object-fit:cover;}
.brand .txt{font-weight:800;font-size:14.5px;line-height:1.2;}
.brand .txt small{display:block;font-weight:500;color:#9fb0cc;font-size:10.5px;}
.nav-item{position:relative;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:#c3cee3;
  font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:2px;overflow:hidden;
  transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out);}
.nav-item::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:0 3px 3px 0;
  background:#fff;transform:scaleY(0);transition:transform var(--dur-fast) var(--ease-out);}
.nav-item.active::before{transform:scaleY(1);}
.nav-item span:first-child{display:inline-block;transition:transform var(--dur-fast) var(--ease-out);}
.nav-item:hover span:first-child{transform:scale(1.15);}
.nav-item:hover{background:#17335f;color:#fff;transform:translateX(2px);}
.nav-item.active{background:var(--blue);color:#fff;}
.nav-item:active{transform:translateX(2px) scale(.98);}
.side-foot{margin-top:auto;padding:10px;font-size:11.5px;color:#9fb0cc;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;position:sticky;top:0;z-index:40;}
.topbar h2{font-size:17px;}
.content{flex:1;padding:22px;max-width:1180px;width:100%;margin:0 auto;}
.burger{display:none;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink);}
@media(max-width:860px){
  .sidebar{position:fixed;inset:0 auto 0 0;z-index:200;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:translateX(0);}
  .burger{display:block;}
  .content{padding:14px;}
  .topbar{padding:10px 14px;}
}
.avatar{width:34px;height:34px;border-radius:999px;background:#eef0f2;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:13px;color:var(--sub);flex:none;}

/* passport cover / My Passport hero */
.passport-hero{position:relative;border-radius:18px;overflow:hidden;color:#fff;margin-bottom:16px;
  background-image:linear-gradient(100deg, rgba(10,20,40,.82) 25%, rgba(10,20,40,.45) 65%, rgba(10,20,40,.15) 100%),
  url('assets/hero/allied-tek-building.webp');
  background-size:cover;background-position:center 40%;padding:26px 26px;}
.passport-hero .tag{font-size:12.5px;letter-spacing:.02em;opacity:.95;font-weight:600;}
.passport-hero h1{font-size:22px;margin:4px 0 2px;}
.passport-hero .meta{font-size:13px;opacity:.92;margin-top:6px;}
.timeline{display:flex;gap:6px;margin-top:14px;}
.timeline .seg{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden;}
.timeline .seg b{display:block;height:100%;background:#fff;transition:width .9s var(--ease-out);}

.info-card{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow);

function addDays(dateStr, n){
  if(!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}
function fmtDate(dateStr){
  if(!dateStr) return "-";
  const d = new Date(dateStr + "T00:00:00");
  const months = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}`;
}
function fmtDateTime(isoStr){
  if(!isoStr) return "-";
  const d = new Date(isoStr);
  if(isNaN(d.getTime())) return "-";
  const months = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  const hh = String(d.getHours()).padStart(2,"0"), mm = String(d.getMinutes()).padStart(2,"0");
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543} ${hh}:${mm} น.`;
}
function daysBetween(a,b){
  return Math.round((new Date(b)-new Date(a))/86400000);
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function toast(msg){

async function apiCall(action, payload){
  if(!API_URL) throw new Error("no api url");
  const res = await fetch(API_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" }, // avoids a CORS preflight against Apps Script
    body: JSON.stringify({ action, ...payload })
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || "unknown error");
  return json;
}
async function apiList(){
  const res = await fetch(API_URL + "?action=list&t=" + Date.now());
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || "unknown error");
  return json;
}
async function refreshDB(){
  const json = await apiList();
  const settingsObj = {};
  (json.settings||[]).forEach(r=>{ settingsObj[r.key] = r.value; });
  DB.org = {
    systemName: settingsObj["ชื่อระบบ"] || "AT Digital Onboarding Passport",
    unit: settingsObj["หน่วยงาน"] || "",
    companies: [settingsObj["บริษัท 1"], settingsObj["บริษัท 2"]].filter(Boolean)
  };
  DB.templates = json.templates || [];
  DB.employees = json.employees || [];
  DB.users = json.users && json.users.length ? json.users : seedDB().users;
  DB.auditLog = json.auditLog || [];

  DB.smartJDs = json.smartJDs || [];
  DB.positionRegistry = json.positionRegistry || [];
}

function resizeImageToDataUrl(file, size){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const side = Math.min(img.width, img.height);
        const sx = (img.width-side)/2, sy = (img.height-side)/2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadPhoto(empId, file){
  const dataUrl = await resizeImageToDataUrl(file, 480);
  const mime = dataUrl.slice(5, dataUrl.indexOf(";"));
  const base64 = dataUrl.slice(dataUrl.indexOf(",")+1);
  const res = await apiCall("uploadPhoto", {id: empId, filename: file.name, mimeType: mime, base64});
  const emp = DB.employees.find(e=>e.id===empId);
  logAudit("อัปโหลดรูปโปรไฟล์", emp ? (emp.fullName||emp.id) : empId);
  return res.photoUrl;
}

function employeeProgress(emp){
  let total=0, done=0;
  for(const k in emp.checklist){
    emp.checklist[k].forEach(i => { total++; if(i.done) done++; });
  }
  return total ? Math.round(done/total*100) : 0;
}
function employeeDayNumber(emp){
  return Math.max(0, daysBetween(emp.startDate, today()));
}
function employeeEndDate(emp){
  return addDays(emp.startDate, emp.durationDays);

function employeeMilestone(emp){
  const d = employeeDayNumber(emp);
  const total = emp.durationDays;
  if(d >= total) return {label:"ครบกำหนดทดลองงาน", key:"done"};
  if(d >= Math.floor(total*0.75)) return {label:`ช่วงใกล้ครบ ${total} วัน`, key:"late"};
  if(d >= 30) return {label:"ช่วงติดตามผล 30–90 วัน", key:"mid"};
  if(d >= 7) return {label:"สัปดาห์แรก", key:"week1"};

}

const REDUCE_MOTION = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

/* ---------------------- Animation helpers (global motion system) ---------------------- */
function animateCount(el, target, duration){
  if(REDUCE_MOTION || !isFinite(target)){ el.textContent = target; return; }
  const start = performance.now();
  function tick(now){
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(target * eased);
    if(t < 1) requestAnimationFrame(tick); else el.textContent = target;
  }
  requestAnimationFrame(tick);
}
function enhanceAnimations(root, isNewRoute){
  if(!root) return;
  // width-based bars/timelines: let them transition smoothly to their target on every render (including poll refreshes)
  root.querySelectorAll(".progress-fill[style*='width'], .timeline .seg b[style*='width']").forEach(el=>{
    if(REDUCE_MOTION) return;
    const target = el.style.width;
    el.style.width = "0%";
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.width = target; }));
  });
  if(!isNewRoute) return; // entrance/stagger/count-up only on a genuine navigation, never on background poll refreshes
  if(!REDUCE_MOTION){
    root.querySelectorAll(".grid, .quick-grid, .stat-ring-grid, .brand-pane-features").forEach(grid=>{
      Array.from(grid.children).forEach((child,i)=>{
        child.style.setProperty("--i", i);
        child.classList.add("anim-fade-up");
      });
    });
  }
  root.querySelectorAll(".count-num[data-target]").forEach(el=>{
    animateCount(el, parseFloat(el.dataset.target)||0, 700);
  });
}
function celebrateConfetti(container){
  if(!container || REDUCE_MOTION) return;
  const colors = ["#c0272d","#2f6fed","#1a7f45","#7c5cf0","#e5091a","#ffd166"];
  for(let i=0;i<18;i++){
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    const angle = Math.random()*Math.PI*2, dist = 60+Math.random()*90;
    piece.style.setProperty("--confetti-end", `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist-40}px)`);
    piece.style.background = colors[i % colors.length];
    piece.style.animationDelay = (Math.random()*0.12)+"s";
    container.appendChild(piece);
    piece.addEventListener("animationend", ()=>piece.remove());
  }
}

function scoreQuizAnswers(def, answers){
  let auto = 0, autoMax = 0, manualPending = 0;
  def.questions.forEach(q=>{
    if(q.ungraded) return;
    if(q.type==="text"){ manualPending++; return; }
    autoMax++;
    if(answers[q.id]===q.correct) auto++;
  });
  return { auto, autoMax, manualPending };
}

  const v = emp.exams && emp.exams[roundKey];
  if(!v) return [];
  return Array.isArray(v) ? v : [v];

  const attempts = getExamAttempts(emp, roundKey);

    marks multiple-choice right/wrong, and shows the correct answer when wrong. */
function renderExamReviewBlock(def, res){
  const answers = (res && res.answers) || {};
  return `
  <div class="small muted mb-8">ผลรวม: ${res?`${res.auto} / ${res.autoMax}`:"-"} ${res && res.manualPending? ` · มีคำถามเขียนตอบรอ HR ตรวจ ${res.manualPending} ข้อ`:""}</div>
  ${def.questions.map((q,qi)=>{
    const given = answers[q.id];
    if(q.type==="text"){
      return `<div style="margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line);">
        <div style="font-weight:700;margin-bottom:6px;">${qi+1}. ${escapeHtml(q.text)} ${q.ungraded?'<span class="pill pill-gray small">ไม่ให้คะแนน</span>':'<span class="pill pill-amber small">รอ HR ตรวจ</span>'}</div>

      </div>`;
    }
    const isCorrect = given === q.correct;
    return `<div style="margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line);">
      <div style="font-weight:700;margin-bottom:6px;">${qi+1}. ${escapeHtml(q.text)} ${isCorrect?'<span class="pill pill-green small">✓ ถูก</span>':'<span class="pill pill-amber small">✗ ผิด</span>'}</div>
      ${q.options.map((opt,oi)=>{
        let style = "";
        if(oi===q.correct) style = "color:var(--green);font-weight:600;";
        else if(oi===given) style = "color:#b3261e;text-decoration:line-through;";
        return `<div class="small" style="padding:3px 0;${style}">${oi===q.correct?'✓ ':(oi===given?'✗ ':'　 ')}${escapeHtml(opt)}</div>`;
      }).join("")}
    </div>`;
  }).join("")}`;
}

    return;
  }
  const session = getSession();
  if(!session){
    root.innerHTML = renderLogin();
    bindLogin();
    return;
  }
  root.innerHTML = renderShell(session);
  bindShell(session);
  renderRoute(session);
}

/* ---------------------- Route dispatch ---------------------- */
function renderRoute(session){
  const content = document.getElementById("content");
  const titleMap = {
    dashboard: session.role==="hr" ? "HR Dashboard" : session.role==="supervisor" ? "Team Onboarding" : "My Passport",
    employees:"Employee Management", templates:"Journey Template", reports:"Reports & Analytics",
    settings:"System Settings", approval:"Approval / Reflections", journey:"My Journey", reflection:"Feedback / แบบสะท้อน",
    policies:"นโยบายและสวัสดิการพนักงาน", exam:"ข้อสอบปฐมนิเทศ / ก่อนผ่านทดลองงาน",
    auditlog:"Audit Logs — ประวัติการใช้งานระบบ", redflag:"Red Flag & Employee Support",
    smartjd:"Smart Job Description", myjd:"Job Description ของฉัน"
  };
  document.getElementById("page-title").textContent = titleMap[STATE.route] || "";

  let html = "";
  if(STATE.route === "policies"){ html = renderPolicies(); }
  else if(STATE.route === "auditlog" && session.role==="hr"){ html = renderAuditLog(); }
  else if(STATE.route === "redflag"){ html = session.role==="hr" ? renderHRRedFlag() : renderEmployeeRedFlag(session); }
  else if(STATE.route === "smartjd" && session.role==="hr"){ html = renderHRSmartJD(); }
  else if(STATE.route === "myjd"){ html = renderEmployeeMyJD(session); }
  else if(session.role === "hr"){
    if(STATE.route==="dashboard") html = renderHRDashboard();
    else if(STATE.route==="employees") html = renderEmployeeManagement();
    else if(STATE.route==="templates") html = renderTemplates();
    else if(STATE.route==="reports") html = renderReports();
    else if(STATE.route==="settings") html = renderSettings();
  } else if(session.role === "supervisor"){
    if(STATE.route==="dashboard") html = renderSupervisorTeam(session);
    else if(STATE.route==="approval") html = renderSupervisorApproval(session);
  } else {
    const emp = DB.employees.find(e=>e.id===session.employeeId);
    if(!emp){ html = `<div class="card">ไม่พบข้อมูลพนักงาน</div>`; }
    else if(STATE.route==="dashboard") html = renderEmployeePassport(emp);
    else if(STATE.route==="journey") html = renderEmployeeJourney(emp);
    else if(STATE.route==="exam") html = renderEmployeeExam(emp);
    else if(STATE.route==="reflection") html = renderEmployeeReflection(emp);
  }

  const routeKey = session.role + ":" + STATE.route;
  const isNewRoute = STATE.lastRouteKey !== routeKey;
  STATE.lastRouteKey = routeKey;

  content.innerHTML = html;
  content.classList.toggle("content-enter", isNewRoute);
  bindAfterRoute(session);
  enhanceAnimations(content, isNewRoute);
}

/* ---------- PDF generation (pdf-lib), matching the real F-PM-25 form ---------- */
async function fetchArrayBuffer(url){ const res = await fetch(url); return await res.arrayBuffer(); }
function dataUrlToBytes(dataUrl){
  const base64 = dataUrl.split(",")[1];
  const bin = atob(base64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function bytesToBase64(bytes){
  let binary = ""; const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  return btoa(binary);
}

async function generateSmartJdPdfBytes(jd){
  const { PDFDocument, rgb } = PDFLib;
  const doc = await PDFDocument.create();
  doc.registerFontkit(fontkit);
  const [regularBytes, boldBytes, logoBytes] = await Promise.all([
    fetchArrayBuffer("assets/fonts/Sarabun-Regular.ttf"),
    fetchArrayBuffer("assets/fonts/Sarabun-Bold.ttf"),
    fetchArrayBuffer("assets/smartjd/allied-tek-logo.png")
  ]);
  const font = await doc.embedFont(regularBytes, {subset:true});
  const fontBold = await doc.embedFont(boldBytes, {subset:true});
  const logoImg = await doc.embedPng(logoBytes);

  const sigImages = {};
  for(const slot of JD_SIG_SLOTS){
    const sig = jd.signatures && jd.signatures[slot.key];
    if(sig && sig.sigDataUrl){
      try{
        const bytes = dataUrlToBytes(sig.sigDataUrl);
        sigImages[slot.key] = sig.sigDataUrl.indexOf("image/jpeg")>-1 ? await doc.embedJpg(bytes) : await doc.embedPng(bytes);
      }catch(e){ /* ignore unreadable signature image */ }
    }
  }

  const PAGE_W = 595.28, PAGE_H = 841.89, MARGIN = 28;
  const CONTENT_W = PAGE_W - MARGIN*2;
  const RED = rgb(0.753,0.153,0.176), BLACK = rgb(0,0,0), WHITE = rgb(1,1,1);
  const GRAY = rgb(0.45,0.45,0.45), LINE = rgb(0.75,0.75,0.75);

  const pages = [];
  let page, y;

  function wrapText(fnt, size, maxWidth, text){
    const words = String(text).split(/\s+/).filter(Boolean);
    const out = []; let cur = "";
    const fits = t => fnt.widthOfTextAtSize(t, size) <= maxWidth;
    for(const w of words){
      const test = cur ? cur + " " + w : w;
      if(fits(test)){ cur = test; continue; }
      if(cur) out.push(cur);
      if(fits(w)){ cur = w; continue; }
      let chunk = "";
      for(const ch of w){ const t2 = chunk+ch; if(fits(t2)) chunk = t2; else { out.push(chunk); chunk = ch; } }
      cur = chunk;
    }
    if(cur) out.push(cur);
    return out.length ? out : [""];
  }

  function drawHeader(isFirst){
    if(isFirst){
      const scale = 110/logoImg.width;
      page.drawImage(logoImg, {x:MARGIN, y:y-logoImg.height*scale, width:logoImg.width*scale, height:logoImg.height*scale});
      page.drawText("Document", {x:MARGIN+130, y:y-13, size:10, font:fontBold});
      page.drawText(jd.docNo||"F-PM-25", {x:MARGIN+130, y:y-29, size:11, font, color:RED});
      const titleX0 = MARGIN+250, titleX1 = PAGE_W-MARGIN-168;
      const titleLines = wrapText(fontBold, 10.5, titleX1-titleX0, "รายละเอียดงาน (Smart Job Description)").slice(0,2);
      const titleStartY = titleLines.length>1 ? y-16 : y-22;
      titleLines.forEach((ln,i)=>{ page.drawText(ln, {x:titleX0, y:titleStartY-i*13, size:10.5, font:fontBold}); });
      page.drawText("Revision:", {x:PAGE_W-MARGIN-160, y:y-13, size:9, font:fontBold});
      page.drawText(String(jd.revision||"04"), {x:PAGE_W-MARGIN-85, y:y-13, size:9, font});
      page.drawText("Effective Date:", {x:PAGE_W-MARGIN-160, y:y-29, size:9, font:fontBold});
      page.drawText(jd.effectiveDate||"02 Apr 2025", {x:PAGE_W-MARGIN-85, y:y-29, size:9, font});
      y -= 44;
      page.drawLine({start:{x:MARGIN,y}, end:{x:PAGE_W-MARGIN,y}, thickness:1, color:BLACK});
      y -= 18;
      [["แผนก", jd.department], ["ส่วน", jd.section], ["ฝ่าย", jd.division]].forEach(([label, val])=>{
        wrapText(font, 11, CONTENT_W, `${label} : ${val||""}`).forEach(ln=>{
          page.drawText(ln, {x:MARGIN, y, size:11, font});
          y -= 15;
        });
      });
      y -= 3;
      wrapText(fontBold, 12, CONTENT_W, `ตำแหน่งงาน : ${jd.position||""}`).forEach(ln=>{
        page.drawText(ln, {x:MARGIN, y, size:12, font:fontBold});
        y -= 16;
      });
      y -= 2;
    } else {
      page.drawText(`${jd.docNo||"F-PM-25"} — Smart Job Description — ${jd.position||""}`, {x:MARGIN, y:y-9, size:8, font, color:GRAY});
      y -= 20;
    }
  }
  function newPage(isFirst){
    page = doc.addPage([PAGE_W, PAGE_H]);
    pages.push(page);
    y = PAGE_H - MARGIN;
    drawHeader(!!isFirst);
  }
  function ensureSpace(h){ if(y - h < MARGIN + 6) newPage(false); }

  function drawSectionBar(label){
    ensureSpace(20);
    page.drawRectangle({x:MARGIN, y:y-16, width:CONTENT_W, height:16, color:BLACK});
    page.drawText(label, {x:MARGIN+6, y:y-12, size:10, font:fontBold, color:WHITE});
    y -= 20;
  }
  function drawRows(items){
    const rows = items.length ? items : [""];
    rows.forEach(line=>{
      wrapText(font, 10.5, CONTENT_W-16, line).forEach(wl=>{
        ensureSpace(15);
        page.drawText(wl, {x:MARGIN+8, y:y-10, size:10.5, font});
        page.drawLine({start:{x:MARGIN,y:y-13}, end:{x:MARGIN+CONTENT_W,y:y-13}, thickness:0.5, color:LINE});
        y -= 15;
      });
    });
  }
  function drawListSection(label, items){ drawSectionBar(label); drawRows(items); y -= 5; }
  function drawSubhead(label){ ensureSpace(15); page.drawText(label, {x:MARGIN+4, y:y-10, size:10.5, font:fontBold}); y -= 15; }
  function drawKVRows(pairs){
    pairs.forEach(([k,v])=>{
      const wrapped = wrapText(font, 10.5, CONTENT_W-180, v||"");
      wrapped.forEach((wl,i)=>{
        ensureSpace(15);
        if(i===0) page.drawText(k, {x:MARGIN+8, y:y-10, size:10.5, font:fontBold});
        page.drawText(wl, {x:MARGIN+180, y:y-10, size:10.5, font});
        page.drawLine({start:{x:MARGIN,y:y-13}, end:{x:MARGIN+CONTENT_W,y:y-13}, thickness:0.5, color:LINE});
        y -= 15;
      });
    });
    y -= 5;
  }

  newPage(true);
  drawListSection("ส่วนที่ 1 : วัตถุประสงค์ที่บริษัทมีหน่วยงานและตำแหน่งงาน (Objectives)", linesOf(jd.objectives));
  drawListSection("ส่วนที่ 2 : หน้าที่ความรับผิดชอบหลัก (Key responsibilities)", linesOf(jd.responsibilities));
  drawListSection("ส่วนที่ 3 : ตัวชี้วัดผลงานตามหน้าที่ความรับผิดชอบ (Performance Indicators)", linesOf(jd.indicators));
  drawSectionBar("ส่วนที่ 4 : คุณสมบัติผู้ดำรงตำแหน่ง (ต้องมีก่อนสมัครงาน)");
  drawKVRows([
    ["อายุตัว", jd.qualAge], ["วุฒิการศึกษา", jd.qualEducation], ["สาขา", jd.qualMajor],
    ["ประสบการณ์ทำงาน", jd.qualExperience], ["ใบอนุญาตต่างๆ", jd.qualLicenses], ["อื่นๆ", jd.qualOther]
  ]);
  drawSectionBar("ส่วนที่ 5 : บทบาทผู้ดำรงตำแหน่ง");
  drawKVRows([
    ["5.1 อำนาจดำเนินการ", jd.authority || "ให้ดูรายละเอียดในคู่มือ / ระบบอำนาจดำเนินการ"],
    ["5.2 สายบังคับบัญชา", jd.reportingLine || "ให้ดูรายละเอียดในผังองค์กร"]
  ]);
  drawSectionBar("ส่วนที่ 6 : ความรู้ ทักษะและคุณลักษณะที่จำเป็นต้องมี (Job Competencies)");
  drawSubhead("6.1 ความรู้/ทักษะ (Knowledge & Skills/Functional competencies)");
  drawRows(linesOf(jd.knowledgeSkills));
  y -= 4;
  drawSubhead("6.2 คุณลักษณะ (Personality/Attitude/Mental abilities)");
  drawRows(linesOf(jd.personality));
  y -= 5;
  drawListSection("ส่วนที่ 7 : การนำ Job Description ไปใช้งาน", linesOf(jd.usage));

  // signature block — always kept together on one block, pushed to a new page if it won't fit
  ensureSpace(95);
  const colW = CONTENT_W/JD_SIG_SLOTS.length;
  const topY = y;
  JD_SIG_SLOTS.forEach((slot,i)=>{
    const x = MARGIN + i*colW;
    const sig = (jd.signatures && jd.signatures[slot.key]) || {};
    wrapText(fontBold, 7.5, colW-8, slot.label).forEach((wl,li)=>{
      page.drawText(wl, {x:x+2, y:topY-9-li*9, size:7.5, font:fontBold});
    });
    if(sigImages[slot.key]){
      const img = sigImages[slot.key];
      const maxW = colW-10, maxH = 32;
      const scale = Math.min(maxW/img.width, maxH/img.height, 1);
      page.drawImage(img, {x:x+4, y:topY-55, width:img.width*scale, height:img.height*scale});
    } else {
      page.drawText("ลงชื่อ.........................", {x:x+2, y:topY-34, size:8, font});
    }
    page.drawText(`( ${sig.name||""} )`, {x:x+2, y:topY-62, size:8, font});
    page.drawText(`ตำแหน่ง ${sig.position||""}`, {x:x+2, y:topY-74, size:8, font});
    page.drawText(`วันที่ ${sig.date||""}`, {x:x+2, y:topY-86, size:8, font});
  });
  y = topY - 95;

  const total = pages.length;
  pages.forEach((p,i)=>{ p.drawText(`Page ${i+1} of ${total}`, {x:PAGE_W-MARGIN-80, y:16, size:8, font, color:GRAY}); });

  return await doc.save();
}

async function generateAndSaveSmartJdPdf(jd, opts){
  opts = opts || {};
  const bytes = await generateSmartJdPdfBytes(jd);
  const filename = `${jd.docNo||"F-PM-25"}_${(jd.position||"JD").replace(/[^\w฀-๿]+/g,"-")}_${jd.id}.pdf`;
  if(API_URL){
    const base64 = bytesToBase64(bytes);
    const monthLabel = new Date().toLocaleDateString("th-TH-u-ca-buddhist", {year:"numeric", month:"long"});
    const emp = jd.assignedEmployeeId ? DB.employees.find(e=>e.id===jd.assignedEmployeeId) : null;
    const res = await apiCall("saveSmartJdPdf", {
      base64, filename, department: jd.department, position: jd.position,
      employeeName: emp ? emp.fullName : "", monthLabel
    });
    jd.drivePdfUrl = res.url;
  }
  if(opts.download !== false){
    const blob = new Blob([bytes], {type:"application/pdf"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }
  return jd.drivePdfUrl;
}

function bindSmartJdFormModal(jd, session){

  document.getElementById("jd-form-close").onclick = close;
  document.getElementById("jd-cancel-btn").onclick = close;
  document.getElementById("jd-save-btn").onclick = async ()=>{
    const v = id => document.getElementById(id).value.trim();
    jd.department = v("jd-department"); jd.section = v("jd-section"); jd.division = v("jd-division"); jd.position = v("jd-position");
    jd.assignedEmployeeId = document.getElementById("jd-assignee").value;
    jd.objectives = v("jd-objectives"); jd.responsibilities = v("jd-responsibilities"); jd.indicators = v("jd-indicators");
    jd.qualAge = v("jd-qualAge"); jd.qualEducation = v("jd-qualEducation"); jd.qualMajor = v("jd-qualMajor");
    jd.qualExperience = v("jd-qualExperience"); jd.qualLicenses = v("jd-qualLicenses"); jd.qualOther = v("jd-qualOther");
    jd.authority = v("jd-authority"); jd.reportingLine = v("jd-reportingLine");
    jd.knowledgeSkills = v("jd-knowledgeSkills"); jd.personality = v("jd-personality"); jd.usage = v("jd-usage");
    if(!jd.position){ toast("กรุณากรอกตำแหน่งงาน"); return; }
    const btn = document.getElementById("jd-save-btn"); btn.disabled = true; btn.textContent = "กำลังสร้าง PDF...";
    try{
      // learn this department/section/division/position combo for future autocomplete
      const known = DB.positionRegistry.some(r=> r.department===jd.department && r.position===jd.position);
      if(!known && jd.department && jd.position){
        DB.positionRegistry.push({department:jd.department, section:jd.section, division:jd.division, position:jd.position});
        persistPositionRegistry().catch(()=>{});
      }
      await generateAndSaveSmartJdPdf(jd);
      const isNew = !!jd._isNew; delete jd._isNew;
      await persistSmartJD(jd, isNew ? "สร้าง Smart JD ใหม่" : "แก้ไข Smart JD");
      if(isNew) DB.smartJDs.push(jd);
      close(); renderRoute(session);
      toast("สร้าง PDF และบันทึกแล้ว");
    }catch(e){ btn.disabled = false; btn.textContent = "บันทึก และสร้าง PDF"; toast("บันทึกไม่สำเร็จ: " + (e.message||"ตรวจสอบการเชื่อมต่อ")); }
  };
}

  document.getElementById("jd-registry-load-default-btn").onclick = ()=>{
    const ta = document.getElementById("jd-registry-csv");
    const existingLines = ta.value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    const existingKeys = new Set(existingLines.map(l=>{
      const parts = l.split(",").map(s=>s.trim());
      return (parts[0]||"") + "||" + (parts[3]||"");
    }));
    const newLines = DEFAULT_POSITION_REGISTRY
      .filter(([d,,,p])=> !existingKeys.has(d + "||" + p))
      .map(r=>r.join(","));
    ta.value = existingLines.concat(newLines).join("\n");
    toast(`เพิ่ม ${newLines.length} รายการจากทะเบียนต้นฉบับ (ตรวจสอบแล้วกด "บันทึกทะเบียน")`);

  document.getElementById("jd-registry-save-btn").onclick = async ()=>{
    const text = document.getElementById("jd-registry-csv").value;
    DB.positionRegistry = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
      const [department="",section="",division="",position=""] = l.split(",").map(s=>s.trim());
      return {department,section,division,position};

    try{ await persistPositionRegistry(); close(); toast("บันทึกทะเบียนแล้ว"); }

      <div class="flex gap-8 mt-8">

        <label class="btn btn-ghost btn-sm" style="cursor:pointer;">แนบรูปลายเซ็น<input type="file" id="jd-sig-upload" accept="image/*" style="display:none;"></label>
      </div>

    </div>
  </div>`;

function bindSignaturePadModal(jd, slot, session, onDone){
  MODAL_OPEN = true;
  const close = ()=>{ MODAL_OPEN = false; closeModal("jd-sig-overlay"); };
  document.getElementById("jd-sig-close").onclick = ()=>{ close(); onDone && onDone(); };

  const canvas = document.getElementById("jd-sig-canvas");
  const ctx = canvas.getContext("2d");
  ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.strokeStyle = "#1a1a1a";
  let drawing = false, hasDrawn = false, uploadedDataUrl = null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { x: cx * (canvas.width/r.width), y: cy * (canvas.height/r.height) };
  }
  function start(e){ drawing = true; uploadedDataUrl = null; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); hasDrawn = true; e.preventDefault(); }
  function end(){ drawing = false; }
  canvas.addEventListener("mousedown", start); canvas.addEventListener("mousemove", move); window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start); canvas.addEventListener("touchmove", move); canvas.addEventListener("touchend", end);

  document.getElementById("jd-sig-clear").onclick = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); hasDrawn = false; uploadedDataUrl = null; };
  document.getElementById("jd-sig-upload").onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      uploadedDataUrl = reader.result;
      const img = new Image();
      img.onload = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0,canvas.width,canvas.height); hasDrawn = true; };
      img.src = uploadedDataUrl;
    };
    reader.readAsDataURL(file);
  };

  document.getElementById("jd-sig-save-btn").onclick = async ()=>{
    const name = document.getElementById("jd-sig-name").value.trim();
    if(!name){ toast("กรุณากรอกชื่อ-นามสกุล"); return; }
    if(!hasDrawn){ toast("กรุณาวาดลายเซ็น หรือแนบรูปลายเซ็น"); return; }
    jd.signatures = jd.signatures || {};
    jd.signatures[slot.key] = {
      name, position: document.getElementById("jd-sig-position").value.trim(),
      date: fmtDateTime(new Date().toISOString()),
      sigDataUrl: uploadedDataUrl || canvas.toDataURL("image/png"),
      signedAt: new Date().toISOString()
    };
    const btn = document.getElementById("jd-sig-save-btn"); btn.disabled = true; btn.textContent = "กำลังบันทึก...";
    try{
      await generateAndSaveSmartJdPdf(jd, {download:false});
      await persistSmartJD(jd, `เซ็น Smart JD: ${slot.label}`);
      close(); onDone && onDone();
      renderRoute(session);
      toast("เซ็นเรียบร้อย");
    }catch(e){ btn.disabled = false; btn.textContent = "บันทึกลายเซ็น"; toast("บันทึกไม่สำเร็จ — ตรวจสอบการเชื่อมต่อ"); }
  };
}

function renderTemplateFormModal(tplId){
  const isNew = !tplId;
  const tpl = isNew ? {

  const phaseBlocks = Object.entries(tpl.checklist).map(([key,ph])=>`
    <div class="card" style="margin-bottom:10px;">
      <div class="flex-between">
        <input data-phase-title="${key}" value="${escapeHtml(ph.title)}" style="font-weight:700;border:none;padding:0;font-size:14px;">
      </div>
      <div id="phase-items-${key}">

          <div class="flex gap-8 mt-8" data-phase-item-row="${key}:${i}">

            <button class="btn btn-ghost btn-sm" data-remove-item="${key}:${i}">ลบ</button>
          </div>`).join("")}
      </div>
      <button class="btn btn-ghost btn-sm mt-8" data-add-item="${key}">+ เพิ่มรายการ</button>

  return `
  <div class="modal-overlay" id="tpl-modal-overlay">
    <div class="modal modal-wide">
      <h3>${isNew?"สร้าง Journey Template":"แก้ไข Template"}</h3>
      <div class="grid grid-2 mt-16">
        <label class="field">ชื่อ Template <input id="tf-name" value="${escapeHtml(tpl.name)}" placeholder="เช่น ช่างเทคนิค - Asset Reliability"></label>
        <label class="field">ระยะเวลาทดลองงานเริ่มต้น (วัน) <input id="tf-duration" type="number" min="1" value="${tpl.durationDays}"></label>
        <label class="field">แผนก / สายงาน <input id="tf-dept" value="${escapeHtml(tpl.department)}"></label>
        <label class="field">ระดับตำแหน่ง <input id="tf-level" value="${escapeHtml(tpl.positionLevel)}"></label>
      </div>
      <div class="section-title">Onboarding Checklist ตามเฟส</div>
      <div id="tpl-phase-container" data-tpl-draft='${escapeHtml(JSON.stringify(tpl))}'>${phaseBlocks}</div>
      <div class="flex-between mt-16">
        <button class="btn btn-ghost" id="tpl-cancel-btn">ยกเลิก</button>

      </div>

function renderReports(){
  const emps = DB.employees;
  const byDept = {};
  emps.forEach(e=>{
    byDept[e.department] = byDept[e.department] || {count:0, progress:0};
    byDept[e.department].count++;
    byDept[e.department].progress += employeeProgress(e);
  });
  const rows = Object.entries(byDept).map(([dept,v])=>`
    <tr><td>${escapeHtml(dept)}</td><td>${v.count}</td><td>${Math.round(v.progress/v.count)}%</td></tr>`).join("");
  return `
  <div class="card">
    <h3>ภาพรวมตามแผนก</h3>
    <table class="mt-8"><thead><tr><th>แผนก</th><th>จำนวนพนักงาน</th><th>ความคืบหน้าเฉลี่ย</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="3" class="muted">ยังไม่มีข้อมูล</td></tr>`}</tbody></table>
  </div>
  <div class="card mt-16">
    <h3>รายละเอียดแบบสะท้อน 2 ทางที่ส่งเข้ามา</h3>
    <table class="mt-8">
      <thead><tr><th>พนักงาน</th><th>รอบ</th><th>สถานะ</th></tr></thead>
      <tbody>
        ${emps.flatMap(e => e.reflectionRounds.map(r=>{
          const rec = e.reflections[r.round];
          const status = rec && rec.employee ? (rec.mentor ? '<span class="pill pill-green">ครบทั้งสองฝ่าย</span>' : '<span class="pill pill-amber">รอพี่เลี้ยงตอบ</span>') : '<span class="pill pill-gray">ยังไม่ส่ง</span>';
          return `<tr><td>${escapeHtml(e.fullName||"-")}</td><td>${escapeHtml(r.label)}</td><td>${status}</td></tr>`;
        })).join("") || `<tr><td colspan="3" class="muted">ยังไม่มีข้อมูล</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

function renderTeamList(filterText){
  const f = (filterText||"").trim();
  const list = DB.employees.filter(e => !f || e.supervisor.name.includes(f) || e.mentor.name.includes(f));
  if(!list.length) return `<div class="card muted">ไม่พบพนักงานที่ตรงกับชื่อนี้ — ลองเว้นว่างเพื่อดูทั้งหมด</div>`;
  return list.map(e=>{
    const p = employeeProgress(e); const m = employeeMilestone(e);
    return `<div class="card mt-16">
      <div class="flex-between">
        <div class="flex gap-8">${avatarImgHtml(e.photoUrl, e.fullName, 40)}<div><h3>${escapeHtml(e.fullName||"-")}</h3><div class="small muted">${escapeHtml(e.position)} · ${escapeHtml(e.department)} · เริ่มงาน ${fmtDate(e.startDate)}</div></div></div>
        <span class="pill pill-gray">${m.label}</span>
      </div>
      <div class="progress-track mt-8"><div class="progress-fill" style="width:${p}%"></div></div>
      <div class="small muted mt-8">ความคืบหน้า ${p}% · วันที่ ${employeeDayNumber(e)}/${e.durationDays}</div>
      <div class="mt-8">${examBadgesHtml(e)}</div>
      <button class="btn btn-ghost btn-sm mt-8" data-open-checklist="${e.id}">เปิด Onboarding Checklist</button>
    </div>`;
  }).join("");
}

function renderSupervisorApproval(session){
  const items = [];
  DB.employees.forEach(e=>{
    e.reflectionRounds.forEach(r=>{
      const rec = e.reflections[r.round];
      if(rec && rec.employee && !rec.mentor){
        items.push({emp:e, round:r});
      }
    });
  });
  return `
  <div class="section-title">แบบสะท้อนที่รอพี่เลี้ยง/หัวหน้างานตอบ</div>
  ${items.length ? items.map(it=>`
    <div class="card mt-16">
      <div class="flex-between">
        <div><b>${escapeHtml(it.emp.fullName)}</b><div class="small muted">${escapeHtml(it.round.label)}</div></div>
        <button class="btn btn-primary btn-sm" data-answer-mentor="${it.emp.id}:${it.round.round}">ตอบแบบสะท้อน</button>
      </div>
    </div>`).join("") : `<div class="card muted">ไม่มีรายการรอตอบในขณะนี้</div>`}
  `;
}

    return `

      <div class="small muted">ทำข้อสอบปฐมนิเทศได้โดยตรงในนี้ — ติ๊กคำตอบแล้วกดส่ง ระบบคำนวณคะแนนให้ทันที (ยกเว้นคำถามแบบเขียนตอบที่ HR จะตรวจภายหลัง)</div>
    </div>
    <div class="section-title">สถานะการสอบ</div>
    <div class="grid grid-2">
      ${Object.values(QUIZ_ROUNDS).map(def=>{
        const res = getExamResult(emp, def.key);
        const pct = res ? res.auto/res.autoMax : null;
        const pass = pct!=null ? pct>=def.passPct : null;
        return `<div class="card">
          <b>📝 ${escapeHtml(def.label)}</b>
          <div class="mt-8">
            ${res
              ? `<span class="${pass?'pill pill-green':'pill pill-amber'}">${res.auto} / ${res.autoMax} — ${pass?'ผ่านเกณฑ์ 80%':'ยังไม่ผ่านเกณฑ์ 80%'}</span>
                 <div class="small muted mt-8">ทำเมื่อ ${fmtDateTime(res.submittedAt)}${res.manualPending?` · รอ HR ตรวจคำตอบเขียน ${res.manualPending} ข้อ`:""}</div>`
              : `<span class="pill pill-gray">ยังไม่ได้ทำ</span>`}
          </div>
          <div class="flex gap-8 mt-16" style="flex-wrap:wrap;">
            <button class="btn ${res && !pass ? 'btn-primary':'btn-secondary'} btn-sm" data-start-exam="${def.key}">${!res? "เริ่มทำข้อสอบ →" : pass? "ทำใหม่อีกครั้ง →" : "สอบซ่อม →"}</button>
            ${res? `<button class="btn btn-ghost btn-sm" data-review-exam-emp="${emp.id}" data-review-exam-round="${def.key}">ดูเฉลยคำตอบ</button>` : ""}
          </div>
        </div>`;
      }).join("")}
      <div class="card">
        <div class="small muted">วันครบกำหนดทดลองงาน</div>
        <div class="mt-8" style="font-weight:700;">${due? fmtDate(due) : "-"}</div>
        <button class="btn btn-ghost btn-sm mt-16" data-exam-history-emp="${emp.id}">ดูประวัติการสอบทั้งหมด</button>
      </div>
    </div>`;
  }
  const def = QUIZ_ROUNDS[STATE.examActiveRound];
  return `
  <div class="card mb-16">
    <b>${escapeHtml(def.label)}</b>
    <div class="small muted mt-4">ข้อสอบมี ${def.questions.length} ข้อ ทุกข้อจำเป็นต้องตอบ — เกณฑ์ผ่าน ${Math.round(def.passPct*100)}%</div>
  </div>
  <div class="card">
    ${def.questions.map((q,qi)=>`
      <div style="margin-bottom:22px;padding-bottom:18px;${qi<def.questions.length-1?'border-bottom:1px solid var(--line);':''}">
        <div style="font-weight:700;margin-bottom:10px;">${qi+1}. ${escapeHtml(q.text)}</div>
        ${q.type==="text"
          ? `<textarea rows="3" data-exam-text="${q.id}" style="width:100%;">${escapeHtml(STATE.examDraft[q.id]||"")}</textarea>`
          : q.options.map((opt,oi)=>`
            <label style="display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;">
              <input type="radio" name="exam-${q.id}" data-exam-opt="${q.id}" value="${oi}" style="width:auto;padding:0;border:none;flex:none;" ${STATE.examDraft[q.id]===oi?'checked':''}>
              <span>${escapeHtml(opt)}</span>
            </label>`).join("")}
      </div>`).join("")}
    <div class="flex gap-8 mt-16">
      <button class="btn btn-secondary" id="exam-cancel-btn">ยกเลิก</button>
      <button class="btn btn-primary" id="exam-submit-btn">ส่งคำตอบ</button>
    </div>
  </div>`;
}

function renderEmployeeReflection(emp){
  return emp.reflectionRounds.map(r=>{
    const rec = emp.reflections[r.round] || {};
    const empDone = !!rec.employee;
    const mentorDone = !!rec.mentor;
    return `<div class="card mt-16">
      <div class="flex-between">
        <h3>${escapeHtml(r.label)}</h3>
        <span class="pill ${empDone && mentorDone ? 'pill-green' : empDone ? 'pill-amber':'pill-gray'}">
          ${empDone && mentorDone ? "ครบทั้งสองฝ่าย" : empDone ? "ส่งแล้ว — รอพี่เลี้ยง" : "ยังไม่ได้ทำ"}
        </span>
      </div>
      ${empDone ? `<p class="small muted mt-8">คุณได้ส่งแบบสะท้อนรอบนี้แล้วเมื่อ ${fmtDate(rec.employeeDate)}</p>`
        : `<button class="btn btn-primary btn-sm mt-16" data-fill-reflection="${r.round}">ทำแบบสะท้อนรอบนี้</button>`}
    </div>`;
  }).join("");
}

/* =========================================================================
   BINDING LOGIC (after each route render)
   ========================================================================= */
function openModal(html){
  MODAL_OPEN = true;
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstElementChild);
}
function closeModal(id){
  MODAL_OPEN = false;
  const el = document.getElementById(id);
  if(!el) return;
  if(REDUCE_MOTION){ el.remove(); return; }
  el.classList.add("closing");
  setTimeout(()=>el.remove(), 180);
}

function bindExamReviewButtons(root){
  root.querySelectorAll("[data-review-exam-emp]").forEach(el=>{
    el.onclick = ()=>{
      const emp = DB.employees.find(e=>e.id===el.dataset.reviewExamEmp);
      const def = QUIZ_ROUNDS[el.dataset.reviewExamRound];
      const attempts = getExamAttempts(emp, def.key);
      const idx = el.dataset.reviewExamAttempt!==undefined ? Number(el.dataset.reviewExamAttempt) : attempts.length-1;
      const res = attempts[idx] || null;
      openModal(`
      <div class="modal-overlay" id="exam-review-overlay">
        <div class="card" style="max-width:720px;width:100%;max-height:88vh;overflow:auto;margin:5vh auto;">
          <div class="flex-between">
            <h3>${escapeHtml(def.label)} — ${escapeHtml(emp.fullName||"")}</h3>
            <button class="btn btn-ghost btn-sm" id="exam-review-close">ปิด</button>
          </div>
          <div class="mt-16">${renderExamReviewBlock(def, res)}</div>
        </div>
      </div>`);
      const reviewOverlay = document.getElementById("exam-review-overlay");
      document.getElementById("exam-review-close").onclick = ()=> closeModal("exam-review-overlay");
      reviewOverlay.onclick = (e)=>{ if(e.target===reviewOverlay) closeModal("exam-review-overlay"); };
    };
  });
}

      bindExamReviewButtons(overlay);
    };
  });
  // Answer review (HR / Supervisor: any employee; Employee: only their own — same UI)
  bindExamReviewButtons(document);
  document.getElementById("exam-submit-btn")?.addEventListener("click", async ()=>{
    const def = QUIZ_ROUNDS[STATE.examActiveRound];
    const unanswered = def.questions.filter(q=>{
      const v = STATE.examDraft[q.id];
      return v===undefined || v===null || v==="";
    });
    if(unanswered.length){ toast(`กรุณาตอบให้ครบทุกข้อ (เหลืออีก ${unanswered.length} ข้อ)`); return; }
    const scored = scoreQuizAnswers(def, STATE.examDraft);
    const emp = DB.employees.find(e=>e.id===session.employeeId);
    emp.exams = emp.exams || {};
    const attempts = getExamAttempts(emp, STATE.examActiveRound);
    const isRetake = attempts.length > 0;
    attempts.push({
      answers: {...STATE.examDraft},
      auto: scored.auto, autoMax: scored.autoMax, manualPending: scored.manualPending,
      submittedAt: new Date().toISOString()
    });
    emp.exams[STATE.examActiveRound] = attempts;
    try{
      await persistEmployee(emp, isRetake ? `สอบซ่อม: ${def.label}` : `ส่งคำตอบข้อสอบ: ${def.label}`);
      STATE.examActiveRound = null; STATE.examDraft = {};
      renderRoute(session);
      toast(`ส่งคำตอบแล้ว — ได้ ${scored.auto}/${scored.autoMax} คะแนน`);

  // HR: employees
  document.getElementById("add-emp-btn")?.addEventListener("click", ()=>{

    openModal(renderEmployeeFormModal(null));
    bindEmployeeFormModal(null);

        try{

          await persistDeleteEmployee(el.dataset.delEmp, emp && emp.fullName);
          DB.employees = DB.employees.filter(e=>e.id!==el.dataset.delEmp);
          renderRoute(session); toast("ลบข้อมูลแล้ว");
        }catch(e){ toast("ลบไม่สำเร็จ — ตรวจสอบการเชื่อมต่อ"); }
      }
    };
  });

  // HR: templates
  document.getElementById("add-tpl-btn")?.addEventListener("click", ()=>{
    openModal(renderTemplateFormModal(null)); bindTemplateFormModal(null);
  });

  });
  document.querySelectorAll("[data-del-tpl]").forEach(el=>{
    el.onclick = async ()=>{
      if(el.disabled) return;
      if(confirm("ยืนยันลบ Template นี้?")){
        try{
          const tpl = DB.templates.find(t=>t.id===el.dataset.delTpl);
          await persistDeleteTemplate(el.dataset.delTpl, tpl && tpl.name);
          DB.templates = DB.templates.filter(t=>t.id!==el.dataset.delTpl);
          renderRoute(session); toast("ลบ Template แล้ว");
        }catch(e){ toast("ลบไม่สำเร็จ — ตรวจสอบการเชื่อมต่อ"); }
      }
    };
  });

  // HR: settings
  document.getElementById("save-org-btn")?.addEventListener("click", async ()=>{
    DB.org.systemName = document.getElementById("set-sysname").value.trim();
    DB.org.unit = document.getElementById("set-unit").value.trim();
    DB.org.companies = document.getElementById("set-companies").value.split(";").map(s=>s.trim()).filter(Boolean);

  document.getElementById("save-pins-btn")?.addEventListener("click", async ()=>{

    DB.users.find(u=>u.role==='supervisor').pin = document.getElementById("set-sup-pin").value.trim();
    try{ await persistUsers(); toast("บันทึกแล้ว"); }catch(e){ toast("บันทึกไม่สำเร็จ — ตรวจสอบการเชื่อมต่อ"); }

  document.getElementById("export-btn")?.addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify(DB,null,2)], {type:"application/json"});

    a.download = `at-onboarding-passport-backup-${today()}.json`;

  const teamFilter = document.getElementById("team-filter");
  if(teamFilter){

  const photoInput = document.getElementById("photo-upload-input");
  if(photoInput){
    photoInput.addEventListener("change", async (e)=>{
      const file = e.target.files[0]; if(!file) return;

}

function renderSupervisorChecklistModal(emp){
  const blocks = Object.entries(emp.checklist).map(([key,items])=>{
    const ph = DB.templates.find(t=>t.id===emp.templateId)?.checklist[key];
    return `<div class="section-title">${escapeHtml(ph?ph.title:key)}</div>
      ${items.map(item=>`
        <div class="checklist-row" data-row="${item.id}">
          <div class="chk-box ${item.done?'done':''}" data-s-chk="${item.id}">${item.done?'✓':''}</div>
          <div>
            <div>${escapeHtml(item.label)}</div>
            <input class="mt-8" placeholder="เหตุผล / บันทึกปัญหาที่พบ / รายละเอียดเพิ่มเติม" data-s-note="${item.id}" value="${escapeHtml(item.note)}">
          </div>
          <div class="small muted" style="text-align:right;white-space:nowrap;">
            <div data-s-date="${item.id}">${item.date?fmtDate(item.date):""}</div>
            <button class="btn btn-primary btn-sm mt-8" data-s-save="${item.id}">บันทึก</button>
          </div>
        </div>`).join("")}`;
  }).join("");
  return `
  <div class="modal-overlay" id="s-chk-modal-overlay">
    <div class="modal modal-wide">
      <div class="flex-between"><h3>${escapeHtml(emp.fullName)} — Onboarding Checklist</h3>
        <button class="btn btn-ghost btn-sm" id="s-chk-close">ปิด</button></div>
      <div class="small muted mt-4">ติ๊ก/แก้ไขเหตุผลแล้วกด "บันทึก" ในแต่ละรายการเพื่อบันทึกทีละข้อ</div>
      ${blocks}
    </div>
  </div>`;
}
function bindSupervisorChecklistModal(emp, session){
  MODAL_OPEN = true;
  document.getElementById("s-chk-close").onclick = ()=>{ MODAL_OPEN = false; closeModal("s-chk-modal-overlay"); };

  function findItem(id){
    for(const k in emp.checklist){
      const item = emp.checklist[k].find(i=>i.id===id);
      if(item) return item;
    }
    return null;
  }

  document.querySelectorAll("[data-s-chk]").forEach(el=>{
    el.onclick = ()=>{
      const item = findItem(el.dataset.sChk);
      if(!item) return;
      const wasAllDone = Object.values(emp.checklist).every(list=>list.every(i=>i.done));
      item.done = !item.done;
      item.date = item.done ? today() : "";
      el.classList.toggle("done", item.done);
      el.textContent = item.done ? "✓" : "";
      const dateEl = document.querySelector(`[data-s-date="${item.id}"]`);
      if(dateEl) dateEl.textContent = item.date ? fmtDate(item.date) : "";
      const nowAllDone = Object.values(emp.checklist).every(list=>list.every(i=>i.done));
      if(item.done && !wasAllDone && nowAllDone){
        celebrateConfetti(document.getElementById("s-chk-modal-overlay"));
        toast("🎉 Checklist ครบทุกข้อแล้ว!");
      }
    };
  });
  document.querySelectorAll("[data-s-note]").forEach(el=>{
    el.addEventListener("input", ()=>{
      const item = findItem(el.dataset.sNote);
      if(item) item.note = el.value;
    });
  });
  document.querySelectorAll("[data-s-save]").forEach(el=>{
    el.onclick = async ()=>{
      const item = findItem(el.dataset.sSave);
      if(!item) return;
      const originalLabel = el.textContent;
      el.disabled = true; el.textContent = "กำลังบันทึก...";
      try{
        await persistEmployee(emp, `อัปเดต Checklist: ${item.label}${item.done?' (เสร็จแล้ว)':' (ยังไม่เสร็จ)'}`);
        toast("บันทึกแล้ว");
      }catch(e){ toast("บันทึกไม่สำเร็จ — ตรวจสอบการเชื่อมต่อ"); }
      el.disabled = false; el.textContent = originalLabel;
    };
  });
}

function bindEmployeeFormModal(empId){
  document.getElementById("emp-cancel-btn").onclick = ()=>closeModal("emp-modal-overlay");
  document.getElementById("ef-template").onchange = (e)=>{
    const tpl = DB.templates.find(t=>t.id===e.target.value);
    document.getElementById("ef-duration").value = tpl.durationDays;
  };
  document.getElementById("emp-save-btn").onclick = async ()=>{
    const tplId = document.getElementById("ef-template").value;
    const tpl = DB.templates.find(t=>t.id===tplId);
    let emp = empId ? DB.employees.find(e=>e.id===empId) : newEmployeeFromTemplate(tpl);
    if(empId && emp.templateId !== tplId){
      // switching template on an existing employee rebuilds checklist/kpi from new template
      emp.checklist = buildChecklistState(tpl.checklist);
      emp.kpi = tpl.kpi.map(k=>({...k, notes:""}));
      emp.reflectionRounds = tpl.reflectionRounds;
    }
    emp.templateId = tplId;
    emp.fullName = document.getElementById("ef-name").value.trim();
    emp.nickname = document.getElementById("ef-nick").value.trim();
    emp.employeeCode = document.getElementById("ef-code").value.trim();
    emp.position = document.getElementById("ef-position").value.trim();
    emp.department = document.getElementById("ef-dept").value.trim();
    emp.startDate = document.getElementById("ef-start").value || today();
    emp.durationDays = parseInt(document.getElementById("ef-duration").value) || tpl.durationDays;
    emp.mentor = {name:val("ef-mentor-name"),position:val("ef-mentor-pos"),phone:val("ef-mentor-phone"),line:""};
    emp.supervisor = {name:val("ef-sup-name"),position:val("ef-sup-pos"),phone:val("ef-sup-phone"),line:""};
    emp.hrContact = {name:val("ef-hr-name"),position:val("ef-hr-pos"),phone:val("ef-hr-phone"),line:""};
    const saveBtn = document.getElementById("emp-save-btn"); saveBtn.disabled = true;
    try{
      await persistEmployee(emp, empId ? `แก้ไขข้อมูลพนักงาน: ${emp.fullName}` : `เพิ่มพนักงานใหม่: ${emp.fullName}`);
      if(!empId) DB.employees.push(emp);
      closeModal("emp-modal-overlay");
      renderRoute(getSession());
      toast("บันทึกข้อมูลพนักงานแล้ว");
    }catch(e){ saveBtn.disabled = false; toast("บันทึกไม่สำเร็จ — ตรวจสอบการเชื่อมต่อ"); }
  };
  function val(id){ return document.getElementById(id).value.trim(); }
}

function bindTemplateFormModal(tplId){
  const container = document.getElementById("tpl-phase-container");
  let draft = JSON.parse(container.dataset.tplDraft);

  function refreshPhaseBlocks(){
    const phaseBlocks = Object.entries(draft.checklist).map(([key,ph])=>`
      <div class="card" style="margin-bottom:10px;">
        <input data-phase-title="${key}" value="${escapeHtml(ph.title)}" style="font-weight:700;border:none;padding:0;font-size:14px;width:100%;">
        <div id="phase-items-${key}">
          ${ph.items.map((item,i)=>`
            <div class="flex gap-8 mt-8">
              <input value="${escapeHtml(item)}" data-phase-item="${key}:${i}" style="flex:1;">
              <button class="btn btn-ghost btn-sm" data-remove-item="${key}:${i}">ลบ</button>
            </div>`).join("")}
        </div>
        <button class="btn btn-ghost btn-sm mt-8" data-add-item="${key}">+ เพิ่มรายการ</button>
      </div>`).join("");
    container.innerHTML = phaseBlocks;
    bindPhaseEvents();
  }
  function bindPhaseEvents(){
    container.querySelectorAll("[data-phase-title]").forEach(el=>{
      el.addEventListener("change", ()=>{ draft.checklist[el.dataset.phaseTitle].title = el.value; });
    });
    container.querySelectorAll("[data-phase-item]").forEach(el=>{
      el.addEventListener("change", ()=>{
        const [key,i] = el.dataset.phaseItem.split(":");
        draft.checklist[key].items[+i] = el.value;
      });
    });
    container.querySelectorAll("[data-remove-item]").forEach(el=>{
      el.onclick = ()=>{
        const [key,i] = el.dataset.removeItem.split(":");
        draft.checklist[key].items.splice(+i,1);
        refreshPhaseBlocks();
      };
    });
    container.querySelectorAll("[data-add-item]").forEach(el=>{
      el.onclick = ()=>{
        draft.checklist[el.dataset.addItem].items.push("รายการใหม่");
        refreshPhaseBlocks();
      };
    });
  }
  bindPhaseEvents();

  document.getElementById("tpl-cancel-btn").onclick = ()=>closeModal("tpl-modal-overlay");
  document.getElementById("tpl-save-btn").onclick = async ()=>{
    draft.name = document.getElementById("tf-name").value.trim();
    draft.durationDays = parseInt(document.getElementById("tf-duration").value) || 119;
    draft.department = document.getElementById("tf-dept").value.trim();
    draft.positionLevel = document.getElementById("tf-level").value.trim();
    if(!draft.name){ toast("กรุณาตั้งชื่อ Template"); return; }
    const saveBtn = document.getElementById("tpl-save-btn"); saveBtn.disabled = true;
    try{
      await persistTemplate(draft);
      const idx = DB.templates.findIndex(t=>t.id===draft.id);
      if(idx>=0) DB.templates[idx] = draft; else DB.templates.push(draft);
      closeModal("tpl-modal-overlay");
      renderRoute(getSession());
      toast("บันทึก Template แล้ว");
    }catch(e){ saveBtn.disabled = false; toast("บันทึกไม่สำเร็จ — ตรวจสอบการเชื่อมต่อ"); }
  };
}

function bindReflectionModal(empId, round, who, session){
  document.getElementById("refl-cancel-btn").onclick = ()=>closeModal("refl-modal-overlay");
  document.getElementById("refl-save-btn").onclick = async ()=>{
    const emp = DB.employees.find(e=>e.id===empId);
    const questions = who === "employee" ? EMPLOYEE_QUESTIONS : MENTOR_QUESTIONS;
    const answers = questions.map((q,i)=>{
      const sel = document.querySelector(`input[name="rq${i}"]:checked`);
      return { q, answer: sel ? sel.value : "yes", note: document.querySelector(`[data-rq-note="${i}"]`).value.trim() };
    });
    const extra = document.getElementById("refl-extra").value.trim();
    emp.reflections[round] = emp.reflections[round] || {};
    if(who === "employee"){
      emp.reflections[round].employee = answers;
      emp.reflections[round].employeeExtra = extra;
      emp.reflections[round].employeeDate = today();
    } else {
      emp.reflections[round].mentor = answers;
      emp.reflections[round].mentorExtra = extra;
      emp.reflections[round].mentorDate = today();
    }
    const saveBtn = document.getElementById("refl-save-btn"); saveBtn.disabled = true;
    try{
      await persistEmployee(emp, `ส่งแบบสะท้อนรอบ ${round} (${who==='employee'?'พนักงาน':'พี่เลี้ยง/หัวหน้างาน'})`);
      closeModal("refl-modal-overlay");
      renderRoute(session);
      toast("บันทึกแบบสะท้อนแล้ว");
    }catch(e){ saveBtn.disabled = false; toast("บันทึกไม่สำเร็จ — ตรวจสอบการเชื่อมต่อ"); }
  };
}
